services:
  postgres:
    image: postgres:17-alpine
    container_name: snowflake-certification-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snowflake_certification}
      POSTGRES_USER: ${POSTGRES_USER:-snowflake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snowflake}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snowflake} -d ${POSTGRES_DB:-snowflake_certification}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - snowflake_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  snowflake-certification-guide:
    build: .
    container_name: snowflake-certification-guide
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8010}:8000"
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://snowflake:snowflake@postgres:5432/snowflake_certification}"
      DATABASE_SCHEMA: "${DATABASE_SCHEMA:-public}"
      DB_POOL_MIN_SIZE: "${DB_POOL_MIN_SIZE:-2}"
      DB_POOL_MAX_SIZE: "${DB_POOL_MAX_SIZE:-12}"
      DB_POOL_TIMEOUT_SECONDS: "${DB_POOL_TIMEOUT_SECONDS:-10}"
      OBSERVABILITY_ENABLED: "${OBSERVABILITY_ENABLED:-true}"
      OBSERVABILITY_LOG_LEVEL: "${OBSERVABILITY_LOG_LEVEL:-INFO}"
      OBSERVABILITY_METRICS_TOKEN: "${OBSERVABILITY_METRICS_TOKEN:-}"
      OBSERVABILITY_ERROR_WEBHOOK_URL: "${OBSERVABILITY_ERROR_WEBHOOK_URL:-}"
      OBSERVABILITY_ALERT_WEBHOOK_URL: "${OBSERVABILITY_ALERT_WEBHOOK_URL:-}"
      OBSERVABILITY_WINDOW_SECONDS: "${OBSERVABILITY_WINDOW_SECONDS:-300}"
      OBSERVABILITY_5XX_ALERT_THRESHOLD: "${OBSERVABILITY_5XX_ALERT_THRESHOLD:-5}"
      OBSERVABILITY_AUTH_FAILURE_ALERT_THRESHOLD: "${OBSERVABILITY_AUTH_FAILURE_ALERT_THRESHOLD:-10}"
      OBSERVABILITY_ALERT_COOLDOWN_SECONDS: "${OBSERVABILITY_ALERT_COOLDOWN_SECONDS:-300}"
      OBSERVABILITY_MAX_LATENCY_SAMPLES: "${OBSERVABILITY_MAX_LATENCY_SAMPLES:-2000}"
      BRAIN_DB: /data/snowflake_certification.sqlite
      SKILL_MAP_CONFIG: /app/config/certification_skill_map.json
      CORE_C03_BLUEPRINT_CONFIG: /app/config/snowpro_core_cof_c03_blueprint.json
      CERTIFICATION_CATALOG_CONFIG: /app/config/certification_catalog.json
      CERTIFICATION_CURRICULA_SUPPLEMENT_CONFIG: /app/config/certification_curricula_supplement.json
      STUDY_CONTENT_CORE_CONFIG: /app/config/study_content_core.json
      SNOWFLAKE_LABS_CONFIG: /app/config/snowflake_lab_challenges.json
      EXAM_SIMULATION_CONFIG: /app/config/exam_simulation.json
      PRIVATE_QUESTION_BANK_DIR: /private/question_bank
      QUESTION_BANK_AUTO_IMPORT: "${QUESTION_BANK_AUTO_IMPORT:-false}"
      SNOWFLAKE_LABS_MODE: "${SNOWFLAKE_LABS_MODE:-offline}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      FORCE_HTTPS: "${FORCE_HTTPS:-false}"
      SECURITY_RATE_LIMIT_ENABLED: "${SECURITY_RATE_LIMIT_ENABLED:-true}"
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:8010}"
      ACCOUNT_EMAIL_DELIVERY_MODE: "${ACCOUNT_EMAIL_DELIVERY_MODE:-outbox}"
      ACCOUNT_EMAIL_WEBHOOK_URL: "${ACCOUNT_EMAIL_WEBHOOK_URL:-}"
      ACCOUNT_EMAIL_WEBHOOK_TOKEN: "${ACCOUNT_EMAIL_WEBHOOK_TOKEN:-}"
      ACCOUNT_EMAIL_ACTION_BASE_URL: "${ACCOUNT_EMAIL_ACTION_BASE_URL:-http://localhost:8010}"
      ACCOUNT_EMAIL_VERIFY_HOURS: "${ACCOUNT_EMAIL_VERIFY_HOURS:-24}"
      ACCOUNT_PASSWORD_RESET_MINUTES: "${ACCOUNT_PASSWORD_RESET_MINUTES:-30}"
      ACCOUNT_CHANGE_EMAIL_HOURS: "${ACCOUNT_CHANGE_EMAIL_HOURS:-2}"
      GOOGLE_AUTH_ENABLED: "${GOOGLE_AUTH_ENABLED:-false}"
      GOOGLE_OIDC_CLIENT_ID: "${GOOGLE_OIDC_CLIENT_ID:-}"
      GOOGLE_OIDC_CLIENT_SECRET: "${GOOGLE_OIDC_CLIENT_SECRET:-}"
      GOOGLE_OIDC_REDIRECT_URI: "${GOOGLE_OIDC_REDIRECT_URI:-http://localhost:8010/api/auth/google/callback}"
      BILLING_ENABLED: "${BILLING_ENABLED:-false}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_PRICE_PREMIUM_100: "${STRIPE_PRICE_PREMIUM_100:-}"
      STRIPE_PRICE_PREMIUM_250: "${STRIPE_PRICE_PREMIUM_250:-}"
      STRIPE_PRICE_PREMIUM_500: "${STRIPE_PRICE_PREMIUM_500:-}"
      STRIPE_PRICE_EXAM_PACK: "${STRIPE_PRICE_EXAM_PACK:-}"
      BILLING_PAST_DUE_GRACE_DAYS: "${BILLING_PAST_DUE_GRACE_DAYS:-3}"
      AFFILIATE_RESOURCES_ENABLED: "${AFFILIATE_RESOURCES_ENABLED:-false}"
      AMAZON_ASSOCIATE_TAG: "${AMAZON_ASSOCIATE_TAG:-}"
    volumes:
      - "${BRAIN_DATA_DIR:-./data}:/data"
      - "${PRIVATE_QUESTION_BANK_HOST_DIR:-./private_content/question_bank}:/private/question_bank:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  snowflake_postgres_data:

[project]
name = "snowflake-certification-platform"
version = "0.13.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.137.2",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.10.3",
  "httpx==0.28.1",
  "google-auth>=2.38,<3",

    - "Anthropic Solutions Architect"
    - "OpenAI Forward-Deployed Engineering leadership"
    - "OpenAI AI Deployment and AI Platform roles"
    - "Cursor Solutions Architect"
    - "Cursor Forward-Deployed Engineer"
    - "Principal Data and AI Architect"
    - "Director of Data and AI Platforms"
    - "AI Platform Engineering Manager"
    - "AI Engineer"
    - "Research Engineer"

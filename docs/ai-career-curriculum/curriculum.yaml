  expert_depth:
    - "Data engineering and architecture"
    - "Product-data systems"
    - "AI/data platforms"
    - "Leadership"
    - "Evaluations"
    - "Reliability and governance"
  production_depth:
    - "LLM applications"
    - "RAG"
    - "Agents and MCP"
    - "AI security"
    - "LLMOps"
  working_literacy:
    - "Training and post-training"
    - "Multimodal AI"
    - "Reinforcement learning"
    - "Interpretability"

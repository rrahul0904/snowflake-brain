  framing: "Senior-career expansion into Data + AI platform leadership, not a career restart"
  target_positioning: "Principal/Director-level Data and AI Platform Leader with deep data-engineering experience, production AI engineering capability, AI research literacy, product-data leadership, and forward-deployed architecture skills"
target_roles:

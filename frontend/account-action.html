<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Account action · Snowflake Certification Guide</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
    main { width: min(92vw, 560px); border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 18px; padding: 28px; box-sizing: border-box; }
    h1 { margin: 0 0 8px; font-size: 1.65rem; }
    p { line-height: 1.5; }
    .muted { opacity: .72; }
    .status { margin: 18px 0; padding: 14px; border-radius: 12px; background: color-mix(in srgb, CanvasText 7%, transparent); }
    label { display: block; margin: 14px 0 6px; font-weight: 650; }
    input { width: 100%; box-sizing: border-box; border: 1px solid color-mix(in srgb, CanvasText 26%, transparent); border-radius: 10px; padding: 11px 12px; font: inherit; background: Canvas; color: CanvasText; }
    button, a.button { display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; padding: 11px 15px; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; background: CanvasText; color: Canvas; }
    button[disabled] { opacity: .55; cursor: wait; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="muted">Snowflake Certification Guide</div>
    <h1 id="title">Secure account action</h1>
    <p id="intro">Checking your secure link…</p>
    <div id="status" class="status" role="status" aria-live="polite">Loading…</div>

    <form id="password-form" class="hidden">
      <label for="new-password">New password</label>
      <input id="new-password" name="new-password" type="password" autocomplete="new-password" minlength="8" required />
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" required />
      <div class="actions"><button id="reset-button" type="submit">Set new password</button></div>
    </form>

    <div class="actions">
      <a class="button" href="/#/home">Return to the guide</a>
      <a class="button" href="/static/account-management.html">Account management</a>
    </div>
  </main>
  <script type="module" src="/static/account-action.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Recover account · Snowflake Certification Guide</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
    main { width: min(92vw, 520px); border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 18px; padding: 28px; box-sizing: border-box; }
    h1 { margin: 4px 0 8px; }
    .muted { opacity: .72; line-height: 1.5; }
    label { display: block; margin: 16px 0 6px; font-weight: 700; }
    input { width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 10px; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); background: Canvas; color: CanvasText; font: inherit; }
    button, a { display: inline-flex; border: 0; border-radius: 10px; padding: 11px 15px; font: inherit; font-weight: 700; text-decoration: none; background: CanvasText; color: Canvas; cursor: pointer; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .secondary { background: color-mix(in srgb, CanvasText 9%, transparent); color: CanvasText; border: 1px solid color-mix(in srgb, CanvasText 22%, transparent); }
    .status { margin-top: 16px; padding: 12px; border-radius: 10px; background: color-mix(in srgb, CanvasText 7%, transparent); }
  </style>
</head>
<body>
  <main>
    <div class="muted">Snowflake Certification Guide</div>
    <h1>Recover your account</h1>
    <p class="muted">Enter your account email. For privacy, the response is the same whether or not an account exists.</p>
    <form id="recovery-form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required />
      <div class="actions"><button type="submit">Send reset link</button><a class="secondary" href="/#/home">Back to sign in</a></div>
    </form>
    <div id="status" class="status" role="status" aria-live="polite">Enter your email to continue.</div>
  </main>
  <script type="module" src="/static/recover-account.js"></script>
</body>
</html>

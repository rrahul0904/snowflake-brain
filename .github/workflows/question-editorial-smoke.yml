name: Question Editorial Maturity Smoke

on:
  pull_request:
    paths:
      - "app/question_editorial.py"
      - "app/question_editorial_policy.py"
      - "migrations/postgres/007_question_editorial_maturity.sql"
      - "migrations/postgres/008_question_editorial_gate.sql"
      - "scripts/question_editorial_admin.py"
      - "scripts/test_question_editorial_maturity.py"
      - ".github/workflows/question-editorial-smoke.yml"
  workflow_dispatch:

concurrency:
  group: question-editorial-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile editorial runtime
        run: python -m compileall -q app scripts/question_editorial_admin.py scripts/test_question_editorial_maturity.py
      - name: Verify automated QA and human approvals on SQLite
        run: python scripts/test_question_editorial_maturity.py

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: editorial_ci
          POSTGRES_USER: snowflake
          POSTGRES_PASSWORD: snowflake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snowflake -d editorial_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://snowflake:snowflake@127.0.0.1:5432/editorial_ci
      DATABASE_SCHEMA: editorial_ci
      DB_POOL_MIN_SIZE: "2"
      DB_POOL_MAX_SIZE: "12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile editorial runtime
        run: python -m compileall -q app scripts/question_editorial_admin.py scripts/test_question_editorial_maturity.py
      - name: Verify automated QA and human approvals on PostgreSQL
        run: python scripts/test_question_editorial_maturity.py

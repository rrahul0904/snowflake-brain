name: Fresh Demo Smoke

on:
  pull_request:
    paths:
      - 'beta-demo/**'
      - '.github/workflows/demo-smoke.yml'
  push:
    branches:
      - 'feature/fresh-demo-v1'
    paths:
      - 'beta-demo/**'
      - '.github/workflows/demo-smoke.yml'

jobs:
  demo-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check beta-demo/data.js
          node --check beta-demo/app.js
          node --check beta-demo/mock-engine.js
      - name: Validate deployment config
        run: python -m json.tool beta-demo/vercel.json >/dev/null
      - name: Block deleted legacy beta and globe assets
        run: |
          test ! -e beta-demo/globe.js
          test ! -e beta-demo/globe.css
          if grep -RniE 'world-major-land|20 beta practice questions|earth-canvas|earth-card|Global Snowflake learning|globe\.js|globe\.css' beta-demo; then
            echo 'Deleted legacy demo or globe content detected'
            exit 1
          fi
      - name: Verify static assets are servable
        run: |
          python3 -m http.server 8088 --directory beta-demo >/tmp/demo-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          curl --fail http://127.0.0.1:8088/ >/dev/null
          curl --fail http://127.0.0.1:8088/styles.css >/dev/null
          curl --fail http://127.0.0.1:8088/mock-engine.css >/dev/null
          curl --fail http://127.0.0.1:8088/data.js >/dev/null
          curl --fail http://127.0.0.1:8088/app.js >/dev/null
          curl --fail http://127.0.0.1:8088/mock-engine.js >/dev/null
      - name: Verify core feature strings
        run: |
          grep -q 'Mistake Collection' beta-demo/index.html
          grep -q 'Adaptive Practice' beta-demo/app.js
          grep -q 'Exam Readiness' beta-demo/app.js
          grep -q 'Cheat Sheet' beta-demo/app.js
          grep -q 'Community Insights' beta-demo/app.js
          grep -q 'COF-C03' beta-demo/data.js
          grep -q 'Prepare with <span>evidence</span>' beta-demo/app.js
          grep -q 'Exam readiness' beta-demo/app.js
          grep -q 'Question map' beta-demo/mock-engine.js
          grep -q 'Remediation queue' beta-demo/mock-engine.js

name: Security Assurance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-and-adversarial:
    name: Unit and adversarial security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest
      - name: Run security unit tests
        run: pytest -q tests/test_security_units.py
      - name: Run adversarial HTTP checks
        run: python scripts/test_security_adversarial.py
      - name: Verify private question-bank integrity contract
        run: python scripts/test_question_bank_manifest_contract.py

  static-and-dependency:
    name: SAST and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install security scanners
        run: python -m pip install --upgrade pip && pip install -r requirements.txt bandit pip-audit
      - name: Bandit high-confidence application scan
        run: bandit -r app -ll -ii
      - name: Python dependency vulnerability audit
        run: pip-audit -r requirements.txt --strict

  dast-baseline:
    name: OWASP ZAP baseline DAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRAIN_DB: /tmp/snowflake-zap.sqlite
      ACCOUNT_EMAIL_DELIVERY_MODE: outbox
      AUTH_COOKIE_SECURE: 'false'
      FORCE_HTTPS: 'false'
      SECURITY_RATE_LIMIT_ENABLED: 'false'
      BILLING_ENABLED: 'false'
      GOOGLE_AUTH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Start isolated application
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 >/tmp/snowflake-zap-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/snowflake-zap-server.log
          exit 1
      - name: Run ZAP baseline against public application surface
        run: |
          docker run --rm --network host \
            -v "$PWD:/zap/wrk/:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8000 \
            -J /zap/wrk/zap-report.json \
            -r /zap/wrk/zap-report.html \
            -I
      - name: Upload ZAP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: |
            zap-report.json
            zap-report.html
            /tmp/snowflake-zap-server.log
          if-no-files-found: ignore

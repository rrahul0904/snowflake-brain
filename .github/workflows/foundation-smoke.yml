name: Certification Guide Smoke

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: certification-guide-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certification-guide-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Compile runtime
        run: python -m compileall app scripts
      - name: Verify candidate API route uniqueness
        run: python scripts/test_unique_api_routes.py
      - name: Verify COF-C03 written guide
        run: python scripts/smoke_core_guide.py
      - name: Verify certification-native architecture
        run: python scripts/smoke_certification_native.py
      - name: Verify V26 end-to-end backend flow
        run: python scripts/smoke_v26.py
      - name: Verify candidate auth and memberships
        run: python scripts/test_auth_membership.py
      - name: Verify login-required certification content boundary
        run: python scripts/test_authenticated_content_boundary.py
      - name: Verify Google identity and trusted billing authority
        run: python scripts/test_google_billing_security.py
      - name: Verify Google OAuth browser transaction binding
        run: python scripts/test_google_browser_state.py
      - name: Verify Google identity continuity
        run: python scripts/test_google_identity_continuity.py
      - name: Verify paid tier transition hardening
        run: python scripts/test_billing_tier_transitions.py
      - name: Verify Stripe unknown-price fail closed
        run: python scripts/test_billing_unknown_price_fail_closed.py
      - name: Verify Exam Pack expiry reconciliation
        run: python scripts/test_exam_pack_expiry_reconciliation.py
      - name: Verify concurrent identity/billing schema bootstrap
        run: python scripts/test_identity_schema_concurrency.py
      - name: Verify private question bank, tiers, and exam allocation
        run: python scripts/test_question_bank_tiers.py
      - name: Verify immutable question versions and sitting linkage
        run: python scripts/test_question_version_immutability.py
      - name: Verify tier resets and fresh timed mock rotation
        run: python scripts/test_tier_reset_full_exams.py
      - name: Verify atomic limited-exam entitlement concurrency
        run: python scripts/test_exam_entitlement_concurrency.py
      - name: Verify affiliate disclosure and no-ad-network policy
        run: python scripts/test_affiliate_no_ads.py
      - name: Verify active frontend syntax
        shell: bash
        run: |
          set -euo pipefail
          files=(
            frontend/app-complete.js
            frontend/router-complete.js
            frontend/api.js
            frontend/auth.js
            frontend/ui.js
            frontend/affiliate-resources.js
            frontend/components/nav.js
            frontend/components/candidate-access.js
            frontend/components/feedback.js
            frontend/components/globe.js
            frontend/components/home-extras.js
            frontend/components/study-shell.js
            frontend/components/toast.js
            frontend/views/home-v26.js
            frontend/views/certifications.js
            frontend/views/curriculum-v26.js
            frontend/views/lesson-v26.js
            frontend/views/practice-v26.js
            frontend/views/mock-landing.js
            frontend/views/mock-start-v26.js
            frontend/views/exam-session-v26.js
            frontend/views/exam-result-v26.js
            frontend/views/progress-v26.js
            frontend/views/lookup-v26.js
            frontend/views/exercises-v26.js
            frontend/views/reference.js
            frontend/views/journal.js
            frontend/views/journal-v26.js
            frontend/views/membership-v26.js
            frontend/views/account-v26.js
            frontend/views/labs.js
            frontend/views/info-v26.js
          )
          for file in "${files[@]}"; do node --check "$file"; done
      - name: Verify recording parity layer is active
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'styles/recording-parity.css' frontend/index-v26.html
          grep -q 'styles/recording-parity-final.css' frontend/index-v26.html
          grep -q 'v26-domain-card-grid' frontend/views/curriculum-v26.js
          grep -q 'v26-readiness-panel' frontend/views/progress-v26.js
          grep -q 'v26-drill-stats' frontend/views/practice-v26.js
          grep -q 'v26-diagnostic-card' frontend/views/practice-v26.js
          grep -q 'v26-lookup-card-grid' frontend/views/lookup-v26.js
          grep -q 'v26-exercise-domain-list' frontend/views/exercises-v26.js
      - name: Verify private bank remains outside tracked/static content
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^private_content/' .gitignore
          grep -q '^private_content$' .dockerignore
          if git ls-files frontend config | grep -Ei '(question[_-]?bank|private[_-]?question).*\.json$'; then
            echo 'Commercial question-bank data is tracked in a public/static path'
            exit 1
          fi
          if grep -RniE 'googlesyndication|doubleclick\.net|googleadservices|adsbygoogle|prebid|taboola|outbrain|adroll|fbevents\.js' frontend; then
            echo 'Advertising network/SDK identifier found in active frontend'
            exit 1
          fi
      - name: Verify legacy runtime remains inactive
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'app-complete.js' frontend/index-v26.html
          if grep -Eq '/static/(styles|replica|guide|guide-study|mock)\.css' frontend/index-v26.html; then
            echo 'Legacy stylesheet is active in the V26 shell'
            exit 1
          fi
          forbidden=(app/ingest.py app/routers/courses.py frontend/views/quiz.js)
          for file in "${forbidden[@]}"; do
            if [[ -e "$file" ]]; then echo "Forbidden legacy runtime file exists: $file"; exit 1; fi
          done
      - name: Verify secret files are not tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env$|.*\.pem$|.*\.key$|secrets/|private_content/)'; then
            echo 'A local secret/private content file is tracked'
            exit 1
          fi

name: Verified Credentials Smoke

on:
  pull_request:
    paths:
      - "app/credential_verification.py"
      - "app/talent_schema.py"
      - "app/routers/credentials.py"
      - "app/main.py"
      - "migrations/postgres/021_verified_talent_credentials.sql"
      - "scripts/smoke_verified_credentials.py"
      - "frontend/api.js"
      - "frontend/router-complete.js"
      - "frontend/views/account-v26.js"
      - "frontend/views/credentials-v26.js"
      - "frontend/styles/talent.css"
      - "frontend/index-v26.html"
      - ".github/workflows/verified-credentials-smoke.yml"
  workflow_dispatch:

concurrency:
  group: verified-credentials-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile credential runtime
        run: python -m compileall -q app scripts/smoke_verified_credentials.py
      - name: Verify Credly credential lifecycle on SQLite
        run: python scripts/smoke_verified_credentials.py

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: credentials_ci
          POSTGRES_USER: snowflake
          POSTGRES_PASSWORD: snowflake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snowflake -d credentials_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://snowflake:snowflake@127.0.0.1:5432/credentials_ci
      DATABASE_SCHEMA: verified_credentials_ci
      DB_POOL_MIN_SIZE: "2"
      DB_POOL_MAX_SIZE: "12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile credential runtime
        run: python -m compileall -q app scripts/smoke_verified_credentials.py
      - name: Verify Credly credential lifecycle on PostgreSQL
        run: python scripts/smoke_verified_credentials.py

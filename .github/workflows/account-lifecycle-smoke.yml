name: Account Lifecycle Smoke

on:
  pull_request:
    paths:
      - "app/account_lifecycle.py"
      - "app/routers/account.py"
      - "app/routers/auth.py"
      - "app/main.py"
      - "migrations/postgres/005_account_lifecycle.sql"
      - "scripts/test_account_lifecycle.py"
      - "frontend/account-*.html"
      - ".github/workflows/account-lifecycle-smoke.yml"
  workflow_dispatch:

concurrency:
  group: account-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile account lifecycle runtime
        run: python -m compileall -q app scripts/test_account_lifecycle.py
      - name: Verify self-service lifecycle on SQLite
        env:
          ACCOUNT_EMAIL_DELIVERY_MODE: outbox
        run: python scripts/test_account_lifecycle.py

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lifecycle_ci
          POSTGRES_USER: snowflake
          POSTGRES_PASSWORD: snowflake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snowflake -d lifecycle_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://snowflake:snowflake@127.0.0.1:5432/lifecycle_ci
      DATABASE_SCHEMA: account_lifecycle_ci
      DB_POOL_MIN_SIZE: "2"
      DB_POOL_MAX_SIZE: "12"
      ACCOUNT_EMAIL_DELIVERY_MODE: outbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile account lifecycle runtime
        run: python -m compileall -q app scripts/test_account_lifecycle.py
      - name: Verify self-service lifecycle on PostgreSQL
        run: python scripts/test_account_lifecycle.py

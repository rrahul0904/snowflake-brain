name: Promote Founder Administrator

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Exact email address of an existing candidate account to promote"
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote-founder-admin:
    name: promote-founder-admin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_MIGRATION_URL: ${{ secrets.PRODUCTION_DATABASE_MIGRATION_URL }}
      DATABASE_SCHEMA: public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Require deployment-only migration credential
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${DATABASE_MIGRATION_URL:-}" ]] || { echo "PRODUCTION_DATABASE_MIGRATION_URL is required" >&2; exit 1; }
      - name: Promote the explicitly selected founder account
        env:
          FOUNDER_EMAIL: ${{ inputs.email }}
        run: python scripts/promote_admin.py --email "$FOUNDER_EMAIL" --confirm-promote
